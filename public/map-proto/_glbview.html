<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GLB viewer (temp)</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>html,body{margin:0;height:100%;background:#1a1712}#c{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:12px;color:#e9dcb6;font:12px ui-monospace,Menlo,monospace;white-space:pre;text-shadow:0 1px 3px #000}</style>
</head>
<body>
<div id="c"></div>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.__err=[]; addEventListener('error',e=>__err.push(e.message||String(e.error)));
// headless preview windows can report innerWidth/Height 0 → 0×0 canvas (renders nothing);
// fall back to a fixed size and expose a resize hook.
let W=innerWidth||1280, H=innerHeight||800;
const renderer=new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;
document.getElementById('c').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2a2620);
const camera=new THREE.PerspectiveCamera(40,W/H,0.01,100);
scene.add(new THREE.HemisphereLight(0xbcd2f0,0x6a5a40,0.8));
const sun=new THREE.DirectionalLight(0xffe2a8,2.2); sun.position.set(-3,5,3); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); scene.add(sun);
const rim=new THREE.DirectionalLight(0x88aaff,0.8); rim.position.set(3,2,-4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xfff0d8,0.3));
const ground=new THREE.Mesh(new THREE.CircleGeometry(2.2,48),new THREE.MeshStandardMaterial({color:0x6b6256,roughness:0.95}));
ground.rotateX(-Math.PI/2); ground.receiveShadow=true; scene.add(ground);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
const spin=new THREE.Group(); scene.add(spin);
const clay=new THREE.MeshStandardMaterial({color:0xb8a99a,roughness:0.72,metalness:0.04});
const SRC = new URLSearchParams(location.search).get('src') || './assets/hobbit.glb';
new GLTFLoader().load(SRC,(g)=>{
  let tris=0;
  const FORCE_CLAY = new URLSearchParams(location.search).has('clay');
  g.scene.traverse(o=>{ if(o.isMesh){ if(!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); if(FORCE_CLAY || !o.material || !o.material.map) o.material=clay; o.castShadow=true; o.receiveShadow=true; tris+=o.geometry.index?o.geometry.index.count/3:o.geometry.attributes.position.count/3; }});
  // normalize: center + scale to ~1.7 tall, feet on ground
  const box=new THREE.Box3().setFromObject(g.scene); const size=new THREE.Vector3(),ctr=new THREE.Vector3();
  box.getSize(size); box.getCenter(ctr);
  const s=1.7/size.y; g.scene.scale.setScalar(s);
  g.scene.position.set(-ctr.x*s,-box.min.y*s,-ctr.z*s);
  spin.add(g.scene); window.__loaded=g.scene;
  camera.position.set(1.6,1.3,2.4); controls.target.set(0,0.9,0); controls.update();
  document.getElementById('hud').textContent='hobbit.glb · '+Math.round(tris)+' tris · normals computed · clay shaded\nno rig · no texture · no vertex color (raw sculpt)';
  window.__ready=true;
},undefined,(e)=>{document.getElementById('hud').textContent='LOAD ERROR: '+e; window.__err.push('load '+e);});
let t=0; function loop(){ t+=0.016; if(window.__spin!==false) spin.rotation.y+=0.012; controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);} loop();
window.renderNow=()=>renderer.render(scene,camera);
window.__resize=(w,h)=>{ W=w||1280; H=h||800; renderer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.render(scene,camera); return W+'x'+H; };
addEventListener('resize',()=>window.__resize(innerWidth,innerHeight));
// SPIKE: clip the model above height y (model-local, pre-scale ~0..1.9) to test a
// "dollhouse cutaway" of the authored shell. DoubleSide so interior faces show.
window.__clip=(y)=>{
  renderer.localClippingEnabled=true;
  const plane=new THREE.Plane(new THREE.Vector3(0,-1,0), y);
  window.__loaded.traverse(o=>{ if(o.isMesh){ const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{ m.clippingPlanes=[plane]; m.side=THREE.DoubleSide; m.clipShadows=true; m.needsUpdate=true; }); }});
  renderer.render(scene,camera); return 'clipped @'+y;
};
window.__setView=(a,el,r)=>{ const ph=(el||30)*Math.PI/180,az=(a||0)*Math.PI/180,rad=r||2.8; camera.position.set(Math.sin(az)*Math.cos(ph)*rad,0.9+Math.sin(ph)*rad,Math.cos(az)*Math.cos(ph)*rad); controls.target.set(0,0.9,0); controls.update(); };
</script>
</body>
</html>
