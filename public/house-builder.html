<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>House Builder — Immortal Engine (dev tool)</title>
<style>
  :root {
    --paper:#f4f0e4; --grid:#cdd7e0; --grid-strong:#b7c3ce; --ink:#2c2a2f; --ink-soft:#6b5f4d;
    --accent:#b8792f; --panel:#efeadb; --panel-line:#d8cfb8; --sel:#d9a441; --room-fill:rgba(58,50,38,0.03);
    --timber:#8a5a2e; --stone:#4a4a52; --wood:#9c6b3e; --wood-dark:#6f4a28; --cloth:#7d95ac; --iron:#3d3f45;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#2a2620; }
  #app { display:grid; grid-template-columns:216px 1fr; grid-template-rows:auto 1fr auto; height:100vh; }
  header { grid-column:1/3; display:flex; align-items:center; gap:12px; padding:8px 14px; background:#221f19; color:#e9e2cf; border-bottom:1px solid #000; }
  header h1 { font-size:14px; font-weight:600; margin:0; letter-spacing:.3px; }
  header .spacer { flex:1; }
  header input[type=text] { background:#34302650; color:#f0e9d6; border:1px solid #4a4433; border-radius:6px; padding:5px 9px; font-size:13px; width:170px; }
  header button { background:#33302640; color:#efe7d3; border:1px solid #4a4433; border-radius:6px; padding:6px 11px; font-size:12px; cursor:pointer; }
  header button:hover { background:#46402f; }
  header button.primary { background:var(--accent); border-color:var(--accent); color:#21170a; font-weight:600; }
  aside { grid-row:2/4; background:var(--panel); border-right:1px solid var(--panel-line); padding:12px; overflow-y:auto; }
  aside .group { margin-bottom:14px; }
  aside .group h2 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--ink-soft); margin:0 0 8px; }
  .tool { display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px; margin-bottom:5px; background:#fbf8ef; border:1px solid var(--panel-line); border-radius:8px; cursor:pointer; text-align:left; font-size:13px; color:var(--ink); }
  .tool:hover { border-color:var(--accent); }
  .tool.active { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:#fff; }
  .tool .swatch { width:26px; height:26px; flex:none; display:inline-flex; }
  .tool small { display:block; color:var(--ink-soft); font-size:10px; }
  .seg { display:flex; gap:6px; margin:6px 0; }
  .seg button { flex:1; padding:6px 4px; font-size:12px; border:1px solid var(--panel-line); background:#fbf8ef; border-radius:7px; cursor:pointer; color:var(--ink); }
  .seg button.on { border-color:var(--accent); background:#fff; box-shadow:inset 0 0 0 1px var(--accent); font-weight:600; }
  main { grid-row:2/3; position:relative; overflow:auto; background:#241f18; display:flex; align-items:center; justify-content:center; }
  canvas#cv { background:var(--paper); box-shadow:0 6px 30px rgba(0,0,0,.5); }
  footer { grid-column:2/3; grid-row:3/4; padding:6px 14px; background:#221f19; color:#b6ad97; font-size:11px; display:flex; gap:14px; align-items:center; }
  footer .hint { color:#8f866f; }
  footer kbd { background:#3a3628; border:1px solid #4a4433; border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:10px; color:#e5ddc8; }
  #status { margin-left:auto; color:var(--sel); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏠 House Builder <span style="opacity:.5;font-weight:400">· Immortal Engine dev tool</span></h1>
    <input id="houseName" type="text" value="new-house"/>
    <div class="spacer"></div>
    <button id="btnClear">New</button>
    <button id="btnImport">Import…</button>
    <button id="btnExport" class="primary">Export JSON</button>
    <input id="fileInput" type="file" accept="application/json" style="display:none"/>
  </header>

  <aside>
    <div class="group">
      <h2>Build</h2>
      <button class="tool active" data-tool="select"><span class="swatch" id="sw-select"></span><span>Select / Move<small>drag pieces · handles</small></span></button>
      <button class="tool" data-tool="room"><span class="swatch" id="sw-room"></span><span>Room<small>drag to draw walls</small></span></button>
      <button class="tool" data-tool="wall"><span class="swatch" id="sw-wall"></span><span>Wall<small>drag one segment</small></span></button>
      <button class="tool" data-tool="door"><span class="swatch" id="sw-door"></span><span>Door<small>click a wall</small></span></button>
      <button class="tool" data-tool="window"><span class="swatch" id="sw-window"></span><span>Window<small>click a wall</small></span></button>
      <button class="tool" data-tool="tunnel"><span class="swatch" id="sw-tunnel"></span><span>Tunnel<small>click two rooms</small></span></button>
    </div>
    <div class="group">
      <h2>Furniture</h2>
      <button class="tool" data-tool="bed"><span class="swatch" id="sw-bed"></span><span>Bed<small>2 × 3</small></span></button>
      <button class="tool" data-tool="barrel"><span class="swatch" id="sw-barrel"></span><span>Barrel<small>1 × 1</small></span></button>
      <button class="tool" data-tool="cookpot"><span class="swatch" id="sw-cookpot"></span><span>Cooking pot<small>1 × 1</small></span></button>
      <button class="tool" data-tool="dresser"><span class="swatch" id="sw-dresser"></span><span>Dresser<small>2 × 1</small></span></button>
    </div>
    <div class="group">
      <h2>Selected</h2>
      <div id="selInfo" style="font-size:12px;color:var(--ink-soft)">nothing selected</div>
      <div id="matRow" style="display:none">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:10px 0 2px">Material</div>
        <div class="seg" id="segMaterial"><button data-mat="timber">Wood</button><button data-mat="stone">Stone</button></div>
      </div>
      <div id="shapeRow" style="display:none">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:6px 0 2px">Shape <span style="text-transform:none;letter-spacing:0">· drag a wall dot to bow it</span></div>
        <div class="seg" id="segShape"><button data-shape="rect">Box</button><button data-shape="round">Round</button></div>
      </div>
      <button class="tool" id="btnDelete" style="margin-top:8px;color:#9a3b2c;border-color:#e0c4bd"><span>Delete<small>or press Delete</small></span></button>
    </div>
  </aside>

  <main><canvas id="cv" width="1008" height="700"></canvas></main>

  <footer>
    <span class="hint"><kbd>R</kbd> rotate furn</span>
    <span class="hint"><kbd>Del</kbd> remove</span>
    <span class="hint">drag a door along its wall to widen it · drag wall endpoints to reshape</span>
    <span id="status"></span>
  </footer>
</div>

<script>
(() => {
  const CELL=28, COLS=36, ROWS=25;
  const cv=document.getElementById('cv'); cv.width=COLS*CELL; cv.height=ROWS*CELL;
  const ctx=cv.getContext('2d');
  const FURN={ bed:{w:2,h:3,label:'bed'}, barrel:{w:1,h:1,label:'barrel'}, cookpot:{w:1,h:1,label:'cooking pot'}, dresser:{w:2,h:1,label:'dresser'} };
  const MAT={ timber:{col:'#8a5a2e',w:3,hatch:false}, stone:{col:'#4a4a52',w:4,hatch:true} };

  let scene=blankScene(), tool='select', sel=null, drag=null, uid=1, tunnelStart=null;
  const nextId=p=>`${p}${uid++}`;
  function blankScene(){ return { name:'new-house', rooms:[], walls:[], openings:[], tunnels:[], furniture:[] }; }
  const roomById=id=>scene.rooms.find(r=>r.id===id);

  const tools=[...document.querySelectorAll('.tool[data-tool]')];
  tools.forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
  function setTool(t){ tool=t; tunnelStart=null; tools.forEach(b=>b.classList.toggle('active',b.dataset.tool===t)); cv.style.cursor=t==='select'?'default':'crosshair'; draw(); }

  function evtPx(e){ const r=cv.getBoundingClientRect(); return { px:(e.clientX-r.left)*(cv.width/r.width), py:(e.clientY-r.top)*(cv.height/r.height) }; }
  function evtCell(e){ const p=evtPx(e); return { gx:Math.floor(p.px/CELL), gy:Math.floor(p.py/CELL), px:p.px, py:p.py }; }
  const cCol=v=>Math.max(0,Math.min(COLS,v)), cRow=v=>Math.max(0,Math.min(ROWS,v));
  const snap=v=>Math.round(v/CELL);

  function furnAt(gx,gy){ for(let i=scene.furniture.length-1;i>=0;i--){ const f=scene.furniture[i]; if(gx>=f.x&&gx<f.x+f.w&&gy>=f.y&&gy<f.y+f.h) return f; } return null; }
  function roomAt(gx,gy){ for(let i=scene.rooms.length-1;i>=0;i--){ const r=scene.rooms[i]; if(gx>=r.x&&gx<r.x+r.w&&gy>=r.y&&gy<r.y+r.h) return r; } return null; }
  function openingAt(px,py){ for(let i=scene.openings.length-1;i>=0;i--){ const o=scene.openings[i]; if(Math.hypot(o.x*CELL-px,o.y*CELL-py)<Math.max(CELL*0.7,(o.len||1)*CELL*0.5)) return o; } return null; }
  function segDist(px,py,x0,y0,x1,y1){ const dx=x1-x0,dy=y1-y0,L2=dx*dx+dy*dy; let t=L2?((px-x0)*dx+(py-y0)*dy)/L2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(x0+t*dx),py-(y0+t*dy)); }
  function wallAt(px,py){ for(let i=scene.walls.length-1;i>=0;i--){ const w=scene.walls[i]; if(segDist(px,py,w.x0*CELL,w.y0*CELL,w.x1*CELL,w.y1*CELL)<7) return w; } return null; }
  function tunnelAt(px,py){ for(let i=scene.tunnels.length-1;i>=0;i--){ const t=scene.tunnels[i], e=tunnelEnds(t); if(e && segDist(px,py,e.a[0],e.a[1],e.b[0],e.b[1])<8) return t; } return null; }

  function edgePoint(r,tx,ty){ const cx=(r.x+r.w/2)*CELL,cy=(r.y+r.h/2)*CELL,dx=tx-cx,dy=ty-cy,hw=r.w*CELL/2,hh=r.h*CELL/2;
    const sx=dx?hw/Math.abs(dx):1e9, sy=dy?hh/Math.abs(dy):1e9, s=Math.min(sx,sy); return [cx+dx*s,cy+dy*s]; }
  function tunnelEnds(t){ const A=roomById(t.a),B=roomById(t.b); if(!A||!B) return null;
    const ca=[(A.x+A.w/2)*CELL,(A.y+A.h/2)*CELL], cb=[(B.x+B.w/2)*CELL,(B.y+B.h/2)*CELL];
    return { a:edgePoint(A,cb[0],cb[1]), b:edgePoint(B,ca[0],ca[1]) }; }

  // nearest wall (room edge OR freeform wall) to a point → {x,y (grid, center), orient, room|null}
  function nearestWall(px,py){ let best=null;
    for(const r of scene.rooms){ const x0=r.x*CELL,y0=r.y*CELL,x1=(r.x+r.w)*CELL,y1=(r.y+r.h)*CELL;
      const edges=[{o:'h',y:y0,a:x0,b:x1},{o:'h',y:y1,a:x0,b:x1},{o:'v',x:x0,a:y0,b:y1},{o:'v',x:x1,a:y0,b:y1}];
      for(const e of edges){ let d,ox,oy;
        if(e.o==='h'){ const c=Math.max(e.a,Math.min(e.b,px)); d=Math.abs(py-e.y)+((px<e.a-2||px>e.b+2)?9999:0); ox=c; oy=e.y; }
        else { const c=Math.max(e.a,Math.min(e.b,py)); d=Math.abs(px-e.x)+((py<e.a-2||py>e.b+2)?9999:0); ox=e.x; oy=c; }
        if(!best||d<best.dist){ let gx,gy;
          if(e.o==='h'){ gx=Math.min(r.x+r.w-0.5,Math.max(r.x+0.5,Math.floor(ox/CELL)+0.5)); gy=oy/CELL; } else { gy=Math.min(r.y+r.h-0.5,Math.max(r.y+0.5,Math.floor(oy/CELL)+0.5)); gx=ox/CELL; }
          best={dist:d,orient:e.o,x:gx,y:gy,room:r.id}; } } }
    for(const w of scene.walls){ const x0=w.x0*CELL,y0=w.y0*CELL,x1=w.x1*CELL,y1=w.y1*CELL,dx=x1-x0,dy=y1-y0,L2=dx*dx+dy*dy;
      let t=L2?((px-x0)*dx+(py-y0)*dy)/L2:0; t=Math.max(0,Math.min(1,t)); const cx=x0+t*dx,cy=y0+t*dy,d=Math.hypot(px-cx,py-cy);
      if(!best||d<best.dist){ best={dist:d,orient:Math.abs(dx)>=Math.abs(dy)?'h':'v',x:cx/CELL,y:cy/CELL,room:null}; } }
    return (best&&best.dist<CELL*1.4)?best:null; }

  // ── mouse ──
  cv.addEventListener('mousedown',(e)=>{ const c=evtCell(e);
    if(tool==='room'){ drag={mode:'draw-room',x0:cCol(c.gx),y0:cRow(c.gy),x1:cCol(c.gx),y1:cRow(c.gy)}; }
    else if(tool==='wall'){ drag={mode:'draw-wall',x0:cCol(snap(c.px)),y0:cRow(snap(c.py)),x1:cCol(snap(c.px)),y1:cRow(snap(c.py))}; }
    else if(tool==='door'||tool==='window'){ const w=nearestWall(c.px,c.py); if(w){ const o={id:nextId('o'),kind:tool,x:w.x,y:w.y,orient:w.orient,len:1,room:w.room}; scene.openings.push(o); select('open',o.id); } else flash('click nearer a wall'); }
    else if(tool==='tunnel'){ const r=roomAt(c.gx,c.gy); if(!r){ flash('click a room'); }
      else if(!tunnelStart){ tunnelStart=r.id; flash('now click the room to link'); }
      else if(r.id!==tunnelStart){ scene.tunnels.push({id:nextId('t'),a:tunnelStart,b:r.id}); tunnelStart=null; flash('tunnel linked'); }
      else { tunnelStart=null; } }
    else if(FURN[tool]){ const def=FURN[tool]; const f={id:nextId('f'),type:tool,x:cCol(c.gx),y:cRow(c.gy),w:def.w,h:def.h,rot:0}; f.x=Math.min(f.x,COLS-f.w); f.y=Math.min(f.y,ROWS-f.h); scene.furniture.push(f); select('furn',f.id); drag={mode:'move-furn',id:f.id,offx:0,offy:0}; setTool('select'); }
    else { // select
      // 1) handles of the currently-selected object take priority
      if(sel&&sel.kind==='room'){ const r=roomById(sel.id); if(r&&r.shape!=='round'){ const H=wallHandles(r); for(const k in H){ const p=H[k]; if(Math.hypot(p[0]-c.px,p[1]-c.py)<9){ drag={mode:'curve-wall',id:r.id,edge:k}; return; } } } }
      if(sel&&sel.kind==='wall'){ const w=scene.walls.find(x=>x.id===sel.id); if(w){ const es=[[w.x0*CELL,w.y0*CELL],[w.x1*CELL,w.y1*CELL]]; for(let i=0;i<2;i++){ if(Math.hypot(es[i][0]-c.px,es[i][1]-c.py)<9){ drag={mode:'wall-end',id:w.id,end:i}; return; } } } }
      // 2) hit-test pieces
      const o=openingAt(c.px,c.py); if(o){ select('open',o.id); drag={mode:'resize-open',id:o.id}; return; }
      const w=wallAt(c.px,c.py); if(w){ select('wall',w.id); drag={mode:'move-wall',id:w.id,px0:c.px,py0:c.py}; return; }
      const f=furnAt(c.gx,c.gy); if(f){ select('furn',f.id); drag={mode:'move-furn',id:f.id,offx:c.gx-f.x,offy:c.gy-f.y}; return; }
      const tn=tunnelAt(c.px,c.py); if(tn){ select('tunnel',tn.id); return; }
      const r=roomAt(c.gx,c.gy); if(r){ select('room',r.id); drag={mode:'move-room',id:r.id,offx:c.gx-r.x,offy:c.gy-r.y}; return; }
      select(null);
    }
    draw();
  });

  window.addEventListener('mousemove',(e)=>{ if(!drag) return; const c=evtCell(e);
    if(drag.mode==='draw-room'){ drag.x1=cCol(c.gx); drag.y1=cRow(c.gy); }
    else if(drag.mode==='draw-wall'){ drag.x1=cCol(snap(c.px)); drag.y1=cRow(snap(c.py)); }
    else if(drag.mode==='move-furn'){ const f=scene.furniture.find(x=>x.id===drag.id); if(f){ f.x=Math.max(0,Math.min(COLS-f.w,c.gx-drag.offx)); f.y=Math.max(0,Math.min(ROWS-f.h,c.gy-drag.offy)); } }
    else if(drag.mode==='move-room'){ const r=roomById(drag.id); if(r){ const nx=Math.max(0,Math.min(COLS-r.w,c.gx-drag.offx)),ny=Math.max(0,Math.min(ROWS-r.h,c.gy-drag.offy)),dx=nx-r.x,dy=ny-r.y; r.x=nx; r.y=ny; scene.openings.filter(o=>o.room===r.id).forEach(o=>{o.x+=dx;o.y+=dy;}); } }
    else if(drag.mode==='curve-wall'){ const r=roomById(drag.id); if(r){ if(!r.curve) r.curve={top:0,right:0,bottom:0,left:0}; const x0=r.x*CELL,y0=r.y*CELL,x1=(r.x+r.w)*CELL,y1=(r.y+r.h)*CELL,cl=v=>Math.max(-5,Math.min(5,v));
      if(drag.edge==='top') r.curve.top=cl((y0-c.py)/CELL); else if(drag.edge==='bottom') r.curve.bottom=cl((c.py-y1)/CELL); else if(drag.edge==='left') r.curve.left=cl((x0-c.px)/CELL); else if(drag.edge==='right') r.curve.right=cl((c.px-x1)/CELL); select('room',r.id); } }
    else if(drag.mode==='wall-end'){ const w=scene.walls.find(x=>x.id===drag.id); if(w){ if(drag.end===0){ w.x0=cCol(snap(c.px)); w.y0=cRow(snap(c.py)); } else { w.x1=cCol(snap(c.px)); w.y1=cRow(snap(c.py)); } } }
    else if(drag.mode==='move-wall'){ const w=scene.walls.find(x=>x.id===drag.id); if(w){ const dx=snap(c.px-drag.px0),dy=snap(c.py-drag.py0); if(dx||dy){ w.x0=cCol(w.x0+dx); w.y0=cRow(w.y0+dy); w.x1=cCol(w.x1+dx); w.y1=cRow(w.y1+dy); drag.px0+=dx*CELL; drag.py0+=dy*CELL; } } }
    else if(drag.mode==='resize-open'){ const o=scene.openings.find(x=>x.id===drag.id); if(o){ const H=(o.orient==='h'); const proj=H?c.px:c.py, cen=(H?o.x:o.y)*CELL; let len=Math.max(1,Math.round(2*Math.abs(proj-cen)/CELL)); const r=roomById(o.room); const max=r?(H?r.w:r.h):12; o.len=Math.max(1,Math.min(max,len)); } }
    draw();
  });

  window.addEventListener('mouseup',()=>{
    if(drag&&drag.mode==='draw-room'){ const x=Math.min(drag.x0,drag.x1),y=Math.min(drag.y0,drag.y1),w=Math.abs(drag.x1-drag.x0),h=Math.abs(drag.y1-drag.y0);
      if(w>=2&&h>=2){ const r={id:nextId('room'),name:`Room ${scene.rooms.length+1}`,shape:'rect',material:'timber',x,y,w,h,curve:{top:0,right:0,bottom:0,left:0}}; scene.rooms.push(r); select('room',r.id); setTool('select'); } }
    else if(drag&&drag.mode==='draw-wall'){ const w={id:nextId('w'),x0:drag.x0,y0:drag.y0,x1:drag.x1,y1:drag.y1,material:'stone'}; if(Math.hypot(w.x1-w.x0,w.y1-w.y0)>=1){ scene.walls.push(w); select('wall',w.id); setTool('select'); } }
    drag=null; draw();
  });

  // ── selection + panel ──
  const matRow=document.getElementById('matRow'), shapeRow=document.getElementById('shapeRow');
  function select(kind,id){ sel=kind?{kind,id}:null; const info=document.getElementById('selInfo'); matRow.style.display='none'; shapeRow.style.display='none';
    if(!sel){ info.textContent='nothing selected'; draw(); return; }
    if(sel.kind==='furn'){ const f=scene.furniture.find(x=>x.id===id); info.innerHTML=`<b>${FURN[f.type].label}</b> · ${f.w}×${f.h}`; }
    else if(sel.kind==='open'){ const o=scene.openings.find(x=>x.id===id); info.innerHTML=`<b>${o.kind}</b> · ${o.len||1} wide<br><span style="font-size:11px">drag along the wall to widen</span>`; }
    else if(sel.kind==='tunnel'){ info.innerHTML=`<b>tunnel</b> · links two rooms`; }
    else if(sel.kind==='wall'){ const w=scene.walls.find(x=>x.id===id); info.innerHTML=`<b>wall segment</b> · ${w.material}<br><span style="font-size:11px">drag endpoints to reshape</span>`; matRow.style.display='block'; setSeg('#segMaterial','mat',w.material); }
    else { const r=roomById(id); const c=r.curve||{}; const bowed=(c.top||c.right||c.bottom||c.left)?' · bowed':''; info.innerHTML=`<b>${r.name}</b> · ${r.w}×${r.h} · ${r.material} · ${r.shape==='round'?'round':'box'}${bowed}`; matRow.style.display='block'; shapeRow.style.display='block'; setSeg('#segMaterial','mat',r.material); setSeg('#segShape','shape',r.shape); }
    draw();
  }
  function setSeg(sel2,attr,val){ document.querySelectorAll(sel2+' button').forEach(b=>b.classList.toggle('on',b.dataset[attr]===val)); }
  document.querySelectorAll('#segMaterial button').forEach(b=>b.addEventListener('click',()=>{ if(!sel) return; if(sel.kind==='room') roomById(sel.id).material=b.dataset.mat; else if(sel.kind==='wall') scene.walls.find(x=>x.id===sel.id).material=b.dataset.mat; select(sel.kind,sel.id); }));
  document.querySelectorAll('#segShape button').forEach(b=>b.addEventListener('click',()=>{ if(sel&&sel.kind==='room'){ roomById(sel.id).shape=b.dataset.shape; select('room',sel.id); } }));

  document.getElementById('btnDelete').addEventListener('click',deleteSel);
  function deleteSel(){ if(!sel) return;
    if(sel.kind==='furn') scene.furniture=scene.furniture.filter(f=>f.id!==sel.id);
    else if(sel.kind==='open') scene.openings=scene.openings.filter(o=>o.id!==sel.id);
    else if(sel.kind==='wall') scene.walls=scene.walls.filter(w=>w.id!==sel.id);
    else if(sel.kind==='tunnel') scene.tunnels=scene.tunnels.filter(t=>t.id!==sel.id);
    else { scene.rooms=scene.rooms.filter(r=>r.id!==sel.id); scene.openings=scene.openings.filter(o=>o.room!==sel.id); scene.tunnels=scene.tunnels.filter(t=>t.a!==sel.id&&t.b!==sel.id); }
    select(null);
  }
  window.addEventListener('keydown',(e)=>{ if(e.target.tagName==='INPUT') return;
    if(e.key==='Delete'||e.key==='Backspace'){ deleteSel(); e.preventDefault(); }
    else if(e.key==='Escape'){ select(null); setTool('select'); }
    else if((e.key==='r'||e.key==='R')&&sel&&sel.kind==='furn'){ const f=scene.furniture.find(x=>x.id===sel.id); const nw=f.h,nh=f.w; f.w=Math.min(nw,COLS-f.x); f.h=Math.min(nh,ROWS-f.y); f.rot=(f.rot+90)%360; select('furn',f.id); }
  });

  // ── rendering ──
  function draw(){ ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle=getCss('--grid'); ctx.lineWidth=1;
    for(let x=0;x<=COLS;x++) line(x*CELL,0,x*CELL,ROWS*CELL);
    for(let y=0;y<=ROWS;y++) line(0,y*CELL,COLS*CELL,y*CELL);
    ctx.strokeStyle=getCss('--grid-strong');
    for(let x=0;x<=COLS;x+=5) line(x*CELL,0,x*CELL,ROWS*CELL);
    for(let y=0;y<=ROWS;y+=5) line(0,y*CELL,COLS*CELL,y*CELL);

    for(const r of scene.rooms) drawRoom(r);
    for(const t of scene.tunnels) drawTunnel(t);
    for(const w of scene.walls) drawWall(w);
    if(drag&&drag.mode==='draw-room'){ const x=Math.min(drag.x0,drag.x1),y=Math.min(drag.y0,drag.y1); ctx.strokeStyle=getCss('--accent'); ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.strokeRect(x*CELL,y*CELL,Math.abs(drag.x1-drag.x0)*CELL,Math.abs(drag.y1-drag.y0)*CELL); ctx.setLineDash([]); }
    if(drag&&drag.mode==='draw-wall'){ ctx.strokeStyle=getCss('--accent'); ctx.lineWidth=3; ctx.setLineDash([6,4]); line(drag.x0*CELL,drag.y0*CELL,drag.x1*CELL,drag.y1*CELL); ctx.setLineDash([]); }
    for(const o of scene.openings) drawOpening(o);
    for(const f of scene.furniture) drawFurn(f);
    if(tunnelStart){ const r=roomById(tunnelStart); if(r){ ctx.strokeStyle=getCss('--sel'); ctx.lineWidth=2.5; ctx.setLineDash([5,3]); ctx.strokeRect(r.x*CELL-3,r.y*CELL-3,r.w*CELL+6,r.h*CELL+6); ctx.setLineDash([]); } }

    drawSelection();
    const d=scene.openings.filter(o=>o.kind==='door').length, wn=scene.openings.filter(o=>o.kind==='window').length;
    document.getElementById('status').textContent=`${scene.rooms.length} rooms · ${scene.walls.length} walls · ${d} doors · ${wn} windows · ${scene.tunnels.length} tunnels · ${scene.furniture.length} furniture`;
  }

  function drawSelection(){ if(!sel) return;
    if(sel.kind==='room'){ const r=roomById(sel.id); if(!r) return; ctx.strokeStyle=getCss('--sel'); ctx.lineWidth=2.5; ctx.setLineDash([4,3]); ctx.strokeRect(r.x*CELL-2,r.y*CELL-2,r.w*CELL+4,r.h*CELL+4); ctx.setLineDash([]);
      if(tool==='select'&&r.shape!=='round'){ const H=wallHandles(r); for(const k in H){ const p=H[k]; ctx.fillStyle=getCss('--accent'); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; circle(p[0],p[1],5); ctx.fill(); ctx.stroke(); } } }
    else if(sel.kind==='furn'){ const f=scene.furniture.find(x=>x.id===sel.id); if(f){ ctx.strokeStyle=getCss('--sel'); ctx.lineWidth=2.5; ctx.setLineDash([4,3]); ctx.strokeRect(f.x*CELL-2,f.y*CELL-2,f.w*CELL+4,f.h*CELL+4); ctx.setLineDash([]); } }
    else if(sel.kind==='open'){ const o=scene.openings.find(x=>x.id===sel.id); if(o){ const half=CELL*(o.len||1)/2; ctx.strokeStyle=getCss('--sel'); ctx.lineWidth=2.5; ctx.setLineDash([4,3]); if(o.orient==='h') ctx.strokeRect(o.x*CELL-half-3,o.y*CELL-8,half*2+6,16); else ctx.strokeRect(o.x*CELL-8,o.y*CELL-half-3,16,half*2+6); ctx.setLineDash([]); } }
    else if(sel.kind==='wall'){ const w=scene.walls.find(x=>x.id===sel.id); if(w){ ctx.strokeStyle=getCss('--sel'); ctx.lineWidth=1.5; for(const p of [[w.x0,w.y0],[w.x1,w.y1]]){ ctx.fillStyle=getCss('--accent'); ctx.strokeStyle='#fff'; circle(p[0]*CELL,p[1]*CELL,5); ctx.fill(); ctx.stroke(); } } }
    else if(sel.kind==='tunnel'){ const e=tunnelEnds(scene.tunnels.find(x=>x.id===sel.id)); if(e){ ctx.strokeStyle=getCss('--sel'); ctx.lineWidth=2.5; ctx.setLineDash([5,3]); line(e.a[0],e.a[1],e.b[0],e.b[1]); ctx.setLineDash([]); } }
  }

  function roomPath(r){ ctx.beginPath();
    if(r.shape==='round'){ ctx.ellipse((r.x+r.w/2)*CELL,(r.y+r.h/2)*CELL,r.w*CELL/2,r.h*CELL/2,0,0,Math.PI*2); return; }
    const c=r.curve||{top:0,right:0,bottom:0,left:0}, x0=r.x*CELL,y0=r.y*CELL,x1=(r.x+r.w)*CELL,y1=(r.y+r.h)*CELL,mx=(x0+x1)/2,my=(y0+y1)/2;
    ctx.moveTo(x0,y0); ctx.quadraticCurveTo(mx,y0-2*c.top*CELL,x1,y0); ctx.quadraticCurveTo(x1+2*c.right*CELL,my,x1,y1); ctx.quadraticCurveTo(mx,y1+2*c.bottom*CELL,x0,y1); ctx.quadraticCurveTo(x0-2*c.left*CELL,my,x0,y0); ctx.closePath(); }
  function wallHandles(r){ const x0=r.x*CELL,y0=r.y*CELL,x1=(r.x+r.w)*CELL,y1=(r.y+r.h)*CELL,mx=(x0+x1)/2,my=(y0+y1)/2,c=r.curve||{top:0,right:0,bottom:0,left:0};
    return { top:[mx,y0-c.top*CELL], right:[x1+c.right*CELL,my], bottom:[mx,y1+c.bottom*CELL], left:[x0-c.left*CELL,my] }; }

  function drawRoom(r){ const m=MAT[r.material]||MAT.timber;
    ctx.save(); roomPath(r); ctx.fillStyle=getCss('--room-fill'); ctx.fill(); ctx.restore();
    if(m.hatch){ ctx.save(); roomPath(r); ctx.clip(); ctx.strokeStyle='rgba(74,80,100,0.28)'; ctx.lineWidth=1;
      const x0=r.x*CELL-CELL,y0=r.y*CELL-CELL,x1=(r.x+r.w)*CELL+CELL,y1=(r.y+r.h)*CELL+CELL;
      for(let d=x0-(y1-y0);d<x1;d+=7){ ctx.beginPath(); ctx.moveTo(d,y0); ctx.lineTo(d+(y1-y0),y1); ctx.stroke(); }
      ctx.globalCompositeOperation='destination-out'; ctx.beginPath();
      if(r.shape==='round') ctx.ellipse((r.x+r.w/2)*CELL,(r.y+r.h/2)*CELL,r.w*CELL/2-6,r.h*CELL/2-6,0,0,7); else ctx.rect(r.x*CELL+6,r.y*CELL+6,r.w*CELL-12,r.h*CELL-12);
      ctx.fillStyle='#000'; ctx.fill(); ctx.restore(); }
    ctx.save(); roomPath(r); ctx.strokeStyle=m.col; ctx.lineWidth=m.w; ctx.lineJoin='round'; ctx.stroke();
    if(m.hatch){ ctx.lineWidth=1.2; ctx.beginPath(); if(r.shape==='round') ctx.ellipse((r.x+r.w/2)*CELL,(r.y+r.h/2)*CELL,r.w*CELL/2-4,r.h*CELL/2-4,0,0,7); else ctx.rect(r.x*CELL+4,r.y*CELL+4,r.w*CELL-8,r.h*CELL-8); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle=getCss('--ink-soft'); ctx.font='600 12px ui-sans-serif,sans-serif'; ctx.textBaseline='top'; ctx.fillText(r.name,r.x*CELL+7,r.y*CELL+6); }

  function drawWall(w){ const m=MAT[w.material]||MAT.stone, x0=w.x0*CELL,y0=w.y0*CELL,x1=w.x1*CELL,y1=w.y1*CELL;
    ln(x0,y0,x1,y1,m.col,m.w);
    if(m.hatch){ const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L*3,ny=dx/L*3; ln(x0+nx,y0+ny,x1+nx,y1+ny,m.col,1.1); } }

  function drawTunnel(t){ const e=tunnelEnds(t); if(!e) return; const pa=e.a,pb=e.b, dx=pb[0]-pa[0],dy=pb[1]-pa[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,W=CELL*1.3;
    // floor carves through, then a faint tint, then two stone side walls
    ln(pa[0],pa[1],pb[0],pb[1],getCss('--paper'),W);
    ctx.save(); ctx.globalAlpha=0.5; ln(pa[0],pa[1],pb[0],pb[1],getCss('--room-fill'),W); ctx.restore();
    ln(pa[0]+nx*W/2,pa[1]+ny*W/2,pb[0]+nx*W/2,pb[1]+ny*W/2,MAT.stone.col,2.4);
    ln(pa[0]-nx*W/2,pa[1]-ny*W/2,pb[0]-nx*W/2,pb[1]-ny*W/2,MAT.stone.col,2.4); }

  function drawOpening(o){ const x=o.x*CELL,y=o.y*CELL,H=(o.orient==='h'),half=CELL*(o.len||1)/2,INK=getCss('--ink'),INKSOFT=getCss('--ink-soft');
    ctx.fillStyle=getCss('--paper'); const th=CELL*0.55; if(H) ctx.fillRect(x-half,y-th/2,half*2,th); else ctx.fillRect(x-th/2,y-half,th,half*2);
    if(o.kind==='door'){ if(H){ ln(x-half,y-4,x-half,y+4,INK,2); ln(x+half,y-4,x+half,y+4,INK,2); ctx.strokeStyle=INKSOFT; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(x-half,y,half*2*0.92,0,Math.PI*0.5); ctx.stroke(); }
      else { ln(x-4,y-half,x+4,y-half,INK,2); ln(x-4,y+half,x+4,y+half,INK,2); ctx.strokeStyle=INKSOFT; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(x,y-half,half*2*0.92,Math.PI*0.5,0,true); ctx.stroke(); } }
    else { const wt=7; if(H){ ln(x-half,y-wt/2,x+half,y-wt/2,INK,1.8); ln(x-half,y+wt/2,x+half,y+wt/2,INK,1.8); ln(x-half,y-wt/2,x-half,y+wt/2,INK,1.6); ln(x+half,y-wt/2,x+half,y+wt/2,INK,1.6); ln(x,y-wt/2,x,y+wt/2,INKSOFT,1.2); }
      else { ln(x-wt/2,y-half,x-wt/2,y+half,INK,1.8); ln(x+wt/2,y-half,x+wt/2,y+half,INK,1.8); ln(x-wt/2,y-half,x+wt/2,y-half,INK,1.6); ln(x-wt/2,y+half,x+wt/2,y+half,INK,1.6); ln(x-wt/2,y,x+wt/2,y,INKSOFT,1.2); } } }

  function drawFurn(f){ const x=f.x*CELL,y=f.y*CELL,w=f.w*CELL,h=f.h*CELL,pad=3,ix=x+pad,iy=y+pad,iw=w-2*pad,ih=h-2*pad;
    if(f.type==='bed'){ ctx.fillStyle=getCss('--cloth'); roundRect(ix,iy,iw,ih,4); ctx.fill(); ctx.fillStyle='#e8eef4'; const p=Math.min(ih*0.28,CELL*0.7); roundRect(ix+3,iy+3,iw-6,p,3); ctx.fill(); ctx.strokeStyle=getCss('--wood-dark'); ctx.lineWidth=1.5; roundRect(ix,iy,iw,ih,4); ctx.stroke(); }
    else if(f.type==='barrel'){ const cx=x+w/2,cy=y+h/2,rr=Math.min(iw,ih)/2; ctx.fillStyle=getCss('--wood'); circle(cx,cy,rr); ctx.fill(); ctx.strokeStyle=getCss('--wood-dark'); ctx.lineWidth=1.5; circle(cx,cy,rr); ctx.stroke(); circle(cx,cy,rr*0.6); ctx.stroke(); }
    else if(f.type==='cookpot'){ const cx=x+w/2,cy=y+h/2,rr=Math.min(iw,ih)/2; ctx.fillStyle=getCss('--iron'); circle(cx,cy,rr); ctx.fill(); ctx.strokeStyle='#20222699'; ctx.lineWidth=2; circle(cx,cy,rr*0.62); ctx.stroke(); ctx.fillStyle=getCss('--iron'); circle(cx-rr,cy,rr*0.16); ctx.fill(); circle(cx+rr,cy,rr*0.16); ctx.fill(); }
    else if(f.type==='dresser'){ ctx.fillStyle=getCss('--wood'); roundRect(ix,iy,iw,ih,3); ctx.fill(); ctx.strokeStyle=getCss('--wood-dark'); ctx.lineWidth=1.5; roundRect(ix,iy,iw,ih,3); ctx.stroke(); const yy=iy+ih/2; line(ix+2,yy,ix+iw-2,yy); ctx.stroke(); ctx.fillStyle=getCss('--wood-dark'); circle(ix+iw/2,iy+ih*0.28,1.6); ctx.fill(); circle(ix+iw/2,iy+ih*0.72,1.6); ctx.fill(); } }

  function line(x0,y0,x1,y1){ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); }
  const ln=(x0,y0,x1,y1,col,lw)=>{ ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); };
  function circle(cx,cy,r){ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  // swatches
  function swatch(id,kind){ const el=document.getElementById(id); if(!el) return; const c=document.createElement('canvas'); c.width=26; c.height=26; el.appendChild(c); const g=c.getContext('2d');
    g.fillStyle=kind==='select'?'#eee':'#fbf8ef'; g.fillRect(0,0,26,26); g.strokeStyle='#00000018'; for(let i=0;i<=26;i+=6.5){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,26); g.moveTo(0,i); g.lineTo(26,i); g.stroke(); }
    if(kind==='room'){ g.strokeStyle='#8a5a2e'; g.lineWidth=2.5; g.strokeRect(3,3,20,20); }
    else if(kind==='wall'){ g.strokeStyle='#4a4a52'; g.lineWidth=3; g.beginPath(); g.moveTo(4,21); g.lineTo(22,6); g.stroke(); }
    else if(kind==='select'){ g.strokeStyle='#b8792f'; g.lineWidth=2; g.setLineDash([2,2]); g.strokeRect(5,5,16,16); }
    else if(kind==='door'){ g.strokeStyle='#2c2a2f'; g.lineWidth=2.2; g.beginPath(); g.moveTo(3,3); g.lineTo(3,20); g.moveTo(23,3); g.lineTo(23,20); g.stroke(); g.strokeStyle='#6b5f4d'; g.lineWidth=1.3; g.beginPath(); g.arc(3,20,18,-Math.PI/2,0); g.stroke(); }
    else if(kind==='window'){ g.strokeStyle='#2c2a2f'; g.lineWidth=2.2; g.beginPath(); g.moveTo(3,3); g.lineTo(3,23); g.moveTo(23,3); g.lineTo(23,23); g.stroke(); g.lineWidth=1.6; g.strokeRect(9,7,8,12); g.beginPath(); g.moveTo(13,7); g.lineTo(13,19); g.stroke(); }
    else if(kind==='tunnel'){ g.fillStyle='#f4f0e4'; g.fillRect(3,10,20,6); g.strokeStyle='#4a4a52'; g.lineWidth=1.6; g.beginPath(); g.moveTo(3,10); g.lineTo(23,10); g.moveTo(3,16); g.lineTo(23,16); g.stroke(); }
    else if(kind==='bed'){ g.fillStyle='#7d95ac'; g.fillRect(5,3,16,20); g.fillStyle='#e8eef4'; g.fillRect(7,5,12,5); }
    else if(kind==='barrel'){ g.fillStyle='#9c6b3e'; g.beginPath(); g.arc(13,13,9,0,7); g.fill(); g.strokeStyle='#6f4a28'; g.lineWidth=1.5; g.beginPath(); g.arc(13,13,5.5,0,7); g.stroke(); }
    else if(kind==='cookpot'){ g.fillStyle='#3d3f45'; g.beginPath(); g.arc(13,13,9,0,7); g.fill(); g.strokeStyle='#20222699'; g.lineWidth=2; g.beginPath(); g.arc(13,13,5.5,0,7); g.stroke(); }
    else if(kind==='dresser'){ g.fillStyle='#9c6b3e'; g.fillRect(3,7,20,12); g.strokeStyle='#6f4a28'; g.lineWidth=1.2; g.strokeRect(3,7,20,12); g.beginPath(); g.moveTo(3,13); g.lineTo(23,13); g.stroke(); } }
  ['select','room','wall','door','window','tunnel','bed','barrel','cookpot','dresser'].forEach(k=>swatch('sw-'+k,k));

  // ── export / import ──
  // Engine-aligned: rooms {shape,material,x,y,w,h(+cx,cy,r · curve)}; walls = free
  // segments; openings = doors/windows {x,y,orient,len}; tunnels exported BOTH as
  // room links {a,b} AND as corridors {pts,w} (handDrawnInterior's corridor shape);
  // furniture carries room-relative ux/uy.
  document.getElementById('btnExport').addEventListener('click',()=>{ scene.name=(document.getElementById('houseName').value||'house').trim();
    const out={ kind:'authored-structure', schema:'house-builder/v3', name:scene.name, grid:{cols:COLS,rows:ROWS,cell:CELL},
      rooms:scene.rooms.map(r=>{ const rec={id:r.id,name:r.name,shape:r.shape,material:r.material,x:r.x,y:r.y,w:r.w,h:r.h};
        if(r.shape==='round'){ rec.cx=r.x+r.w/2; rec.cy=r.y+r.h/2; rec.r=+(Math.min(r.w,r.h)/2).toFixed(3); }
        const c=r.curve||{}; if(c.top||c.right||c.bottom||c.left) rec.curve={top:+(c.top||0).toFixed(3),right:+(c.right||0).toFixed(3),bottom:+(c.bottom||0).toFixed(3),left:+(c.left||0).toFixed(3)}; return rec; }),
      walls:scene.walls.map(w=>({x0:w.x0,y0:w.y0,x1:w.x1,y1:w.y1,material:w.material})),
      openings:scene.openings.map(o=>({kind:o.kind,x:o.x,y:o.y,orient:o.orient,len:o.len||1,room:o.room||null})),
      tunnels:scene.tunnels.map(t=>({a:t.a,b:t.b})),
      corridors:scene.tunnels.map(t=>{ const A=roomById(t.a),B=roomById(t.b); if(!A||!B) return null; return {pts:[[+(A.x+A.w/2).toFixed(2),+(A.y+A.h/2).toFixed(2)],[+(B.x+B.w/2).toFixed(2),+(B.y+B.h/2).toFixed(2)]],w:1.3,material:'stone'}; }).filter(Boolean),
      furniture:scene.furniture.map(f=>{ const room=enclosingRoom(f); const rec={type:f.type,x:f.x,y:f.y,w:f.w,h:f.h,rot:f.rot||0}; if(room){ rec.room=room.id; rec.ux=+((f.x-room.x+f.w/2)/room.w).toFixed(4); rec.uy=+((f.y-room.y+f.h/2)/room.h).toFixed(4); } return rec; }) };
    const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${scene.name||'house'}.json`; a.click(); URL.revokeObjectURL(a.href); flash('exported '+a.download); });
  function enclosingRoom(f){ const cx=f.x+f.w/2,cy=f.y+f.h/2; return scene.rooms.find(r=>cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)||null; }

  document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change',(e)=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const d=JSON.parse(rd.result); scene=blankScene(); scene.name=d.name||'house'; document.getElementById('houseName').value=scene.name;
      (d.rooms||[]).forEach(r=>scene.rooms.push({id:r.id||nextId('room'),name:r.name||'Room',shape:r.shape||'rect',material:r.material||'timber',x:r.x,y:r.y,w:r.w,h:r.h,curve:r.curve||{top:0,right:0,bottom:0,left:0}}));
      (d.walls||[]).forEach(w=>scene.walls.push({id:nextId('w'),x0:w.x0,y0:w.y0,x1:w.x1,y1:w.y1,material:w.material||'stone'}));
      (d.openings||[]).forEach(o=>scene.openings.push({id:nextId('o'),kind:o.kind||'door',x:o.x,y:o.y,orient:o.orient||'h',len:o.len||1,room:o.room||null}));
      (d.tunnels||[]).forEach(t=>scene.tunnels.push({id:nextId('t'),a:t.a,b:t.b}));
      (d.furniture||[]).forEach(f=>{ const def=FURN[f.type]||{w:f.w||1,h:f.h||1}; scene.furniture.push({id:nextId('f'),type:f.type,x:f.x,y:f.y,w:f.w||def.w,h:f.h||def.h,rot:f.rot||0}); });
      select(null); flash('imported '+file.name); draw();
    }catch(err){ flash('import failed: '+err.message); } }; rd.readAsText(file); e.target.value=''; });

  document.getElementById('btnClear').addEventListener('click',()=>{ const n=scene.rooms.length+scene.walls.length+scene.openings.length+scene.tunnels.length+scene.furniture.length; if(n && !confirm('Clear the whole house?')) return; scene=blankScene(); document.getElementById('houseName').value='new-house'; select(null); setTool('room'); });

  let flashT=null; function flash(msg){ const s=document.getElementById('status'); s.textContent=msg; clearTimeout(flashT); flashT=setTimeout(draw,2200); }

  setTool('room'); draw();
})();
</script>
</body>
</html>
