<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Unified scale — hamlet (fog of war)</title>
<style>
  html,body{margin:0;background:#3a3f37;color:#cdd2c4;font-family:ui-sans-serif,system-ui,sans-serif;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  h1{font-size:14px;opacity:.85;margin:0;}
  .bar{display:flex;gap:10px;align-items:center;font-size:13px;}
  button{font:inherit;background:#cdd2c4;color:#2a2e27;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;}
  button.on{background:#c0392b;color:#fff;}
  #status{opacity:.8;min-height:18px;font-size:13px;}
  canvas{box-shadow:0 18px 60px rgba(0,0,0,.55);border-radius:4px;cursor:pointer;}
  #err{color:#e88;white-space:pre-wrap;font-size:12px;}
</style></head>
<body>
<h1>Oakhollow — line-of-sight fog of war. Walls and trees block sight; blind-fire into the fog.</h1>
<div class="bar"><button id="walk" class="on">Walk</button><button id="aim">Aim Fireball 🔥</button><span id="status">Click to walk. Things you can't see are hidden — explore to reveal.</span></div>
<div id="err"></div>
<canvas id="c" width="1120" height="720"></canvas>
<script type="module">
const err = document.getElementById('err'), status = document.getElementById('status');
try {
  const { createPlaceMap } = await import('/map/handDrawnPlace.js');
  const { getPlan } = await import('/map/plans/index.js');
  const cv = document.getElementById('c');
  const map = createPlaceMap(cv, { seed: 'oakhollow', fog: true, sight: 9 });

  const HAMLET = {
    terrain: {
      paths: [{ pts: [[0, 11], [7, 11], [12, 10.5], [18, 11], [24, 10.6], [31, 11]], w: 1.3 },
              { pts: [[4, 9.4], [4, 11]], w: 0.8 }, { pts: [[15, 10.5], [15, 11]], w: 0.8 }, { pts: [[12, 11], [12, 12]], w: 0.7 }],
      streams: [{ pts: [[21, 0], [21.6, 6], [20.6, 11], [21, 18]], w: 1.1 }],
      bridges: [{ x: 20.8, y: 11 }],
      groves: [{ cx: 3, cy: 15.2, r: 3, n: 12 }, { cx: 28, cy: 15, r: 2.6, n: 8 }, { cx: 2.5, cy: 3, r: 2.2, n: 7 }],
      fields: [{ cx: 26, cy: 4, w: 5, h: 4 }],
      fences: [{ pts: [[23.4, 2], [28.6, 2], [28.6, 6], [23.4, 6], [23.4, 2]] }],
      props: [{ type: 'well', ux: 12, uy: 12.2 }, { type: 'tree', ux: 9, uy: 13.5, r: 0.8 }, { type: 'tree', ux: 17, uy: 13.5, r: 0.7 }, { type: 'shrub', ux: 6.5, uy: 9.2 }, { type: 'shrub', ux: 19, uy: 9.4 }, { type: 'rock', ux: 24, uy: 13 }, { type: 'shrub', ux: 14, uy: 12.5 }]
    },
    buildings: [
      { plan: getPlan('cottage'), ox: -1, oy: 1.5 },
      { plan: getPlan('smithy'), ox: 11, oy: 2.5 },
      { plan: getPlan('shed'), ox: 23, oy: 7.5 }
    ],
    tokens: [
      { type: 'player', ux: 12, uy: 12.9 },
      { type: 'npc', ux: 13.2, uy: 11.6, label: 'M' },
      { type: 'mon', ux: 4, uy: 13.8, info: { ref: 'gray_wolf', name: 'Gray Wolf', tags: ['beast'] } },     // behind the grove
      { type: 'mon', ux: 16, uy: 3.2, info: { ref: 'bandit', name: 'Bandit', tags: ['humanoid'] } },          // behind the smithy
      { type: 'mon', ux: 3, uy: 5.4, info: { ref: 'giant_rat', name: 'Giant Rat', tags: ['beast'] } }         // inside the cottage
    ]
  };

  let mode = 'walk';
  const walkBtn = document.getElementById('walk'), aimBtn = document.getElementById('aim');
  function setMode(m) { mode = m; walkBtn.classList.toggle('on', m === 'walk'); aimBtn.classList.toggle('on', m === 'aim'); status.textContent = m === 'aim' ? 'Click anywhere — even into the fog — to hurl a fireball.' : 'Click to walk. Explore to reveal.'; }
  walkBtn.onclick = () => setMode('walk'); aimBtn.onclick = () => setMode('aim');

  cv.addEventListener('click', e => {
    const { ux, uy } = map.screenToUnit(e.clientX, e.clientY);
    if (mode === 'aim') {
      const hits = map.castAt(ux, uy, 1.7); map.draw(HAMLET);
      status.textContent = hits.length ? ('🔥 Fireball hits: ' + hits.map(h => (h.info && h.info.name) || h.label || h.type).join(', ') + (hits.some(h => h.type === 'npc') ? '  (…that was your ally. oof.)' : '')) : '🔥 Fireball hits nothing but scorched grass.';
      setMode('walk');
    } else {
      const p = HAMLET.tokens.find(t => t.type === 'player'); p.ux = ux; p.uy = uy; map.clearBlast(); map.draw(HAMLET);
    }
  });

  map.draw(HAMLET);
  window.__map = map; window.__H = HAMLET; window.__status = status;
  window.__ok = true;
} catch (e) { err.textContent = 'ERROR: ' + (e && e.stack || e); window.__ok = false; }
</script>
</body></html>
