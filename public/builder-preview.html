<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Builder Preview — Immortal Engine (dev tool)</title>
<!-- Three.js resolution for the 3D interior renderer (builderPreview3d.js imports
     the bare specifier 'three') — same import map + CDN/version as v1.html. -->

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
  html,body { margin:0; height:100%; background:#161512; color:#e9e2cf;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #banner { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:8px 14px; background:#2a2113; border-bottom:1px solid #6b5424; font-size:12.5px; line-height:1.4; }
  #banner .tag { flex:none; background:#d9a441; color:#241a08; font-weight:700; font-size:11px;
    letter-spacing:.8px; padding:2px 8px; border-radius:5px; }
  #banner b { color:#f0d9a4; }
  #banner a { color:#d9a441; }
  #stage { position:absolute; top:42px; bottom:0; left:0; right:0; }
  .msg { max-width:520px; margin:18vh auto 0; padding:22px 26px; background:#211d15; border:1px solid #4a4433;
    border-radius:10px; font-size:14px; line-height:1.6; color:#d8cfb8; }
  .msg a { color:#d9a441; }
</style>
</head>
<body>
<div id="banner">
  <span class="tag">PREVIEW</span>
  <span><b id="bname">…</b> — a 3D view of the building you drew, rendered with the game's own furniture art.
    <b>Nothing here is saved</b>; your real game save is untouched.
    Drag to orbit · scroll to zoom · close this tab to return to the Builder.</span>
</div>
<div id="stage"></div>
<script type="module">
  // BUILDER-PREVIEW-2 — one-click 3D INTERIOR preview of a House Builder draft.
  //
  // A dedicated interior renderer (builderPreview3d.js) draws the authored floor
  // plan DIRECTLY — room floors, walls with door gaps, the game's GLB furniture
  // standing at the drawn positions, a person for scale — framed on the building.
  // No engine world, no settlement: the raw builder doc IS the input. EPHEMERAL:
  // this page only READS the ie.builderPreview scratch key and never writes any
  // storage (U689), so the real save is untouched.
  const stage = document.getElementById('stage');
  const say = (html) => { stage.innerHTML = `<div class="msg">${html}</div>`; };

  let payload = null;
  try { payload = JSON.parse(localStorage.getItem('ie.builderPreview') || 'null'); } catch {}

  if (!payload || !payload.doc) {
    document.getElementById('bname').textContent = 'no draft';
    say('No preview draft found.<br/><br/>Open the <a href="/house-builder.html">House Builder</a>, draw a building, then click <b>Preview 3D</b> — it stashes the current draft here and opens this page.');
  } else {
    const when = payload.savedAt ? new Date(payload.savedAt).toLocaleTimeString() : '';
    document.getElementById('bname').textContent = `${payload.name || 'house'}${when ? ' · drafted ' + when : ''}`;
    try {
      const { mountBuilderPreview3D } = await import('/map/builderPreview3d.js');
      const ctrl = await mountBuilderPreview3D(stage, payload.doc);
      window.__builderPreview = ctrl; // debug handle (ctrl.layout is the pure geometry spec)
      if (!ctrl.layout.rooms.length) {
        say('This draft has no rooms to preview yet.<br/><br/>Draw at least one room in the <a href="/house-builder.html">House Builder</a>, then click <b>Preview 3D</b> again.');
      }
    } catch (err) {
      console.error(err);
      say(`Preview failed to render: <b>${(err && err.message) || err}</b><br/><br/>Open this page via the dev server (npm run dev → http://localhost:5179/builder-preview.html) and re-run Preview 3D from the Builder.`);
    }
  }
</script>
</body>
</html>
