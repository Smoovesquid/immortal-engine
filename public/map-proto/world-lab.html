<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>World lab — REAL buildSettlement + buildWilderness (camps + livestock)</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>html,body{margin:0;height:100%;background:#141a12;overflow:hidden}#c{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:12px;color:#dfe9cf;font:12px ui-monospace,Menlo,monospace;white-space:pre;text-shadow:0 1px 3px #000}</style>
</head>
<body>
<div id="c"></div>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createWorldMaterials, buildSettlement, buildWilderness, nodeRng } from '/map/worldAssets.js';
import { ensureFoliageGLBs } from '/map/treeAssets.js';
import { ensureCreatureKit } from '/map/creatureKit.js';
window.__err=[]; addEventListener('error',e=>__err.push(e.message||String(e.error)));
let W=innerWidth||1280,H=innerHeight||800;
const renderer=new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;
document.getElementById('c').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x141a12);
const camera=new THREE.PerspectiveCamera(40,W/H,0.02,400);
scene.add(new THREE.HemisphereLight(0xbcd2f0,0x40331f,0.9));
const sun=new THREE.DirectionalLight(0xffe6b0,1.5); sun.position.set(8,14,8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40; scene.add(sun);
scene.add(new THREE.AmbientLight(0xfff0d8,0.4));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0x415033,roughness:1}));
ground.rotateX(-Math.PI/2); ground.receiveShadow=true; scene.add(ground);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;

function place(){
  const mats=createWorldMaterials(THREE);
  // Aldermere at origin (livestock)
  const town=buildSettlement(THREE, mats, nodeRng('aldermere','town'), ()=>0, true, []); scene.add(town);
  // wilderness nodes around it — several seeds so some roll as bandit camps
  const seeds=['w1','camp2','w3','w4','camp5','w6'];
  const R=40;
  seeds.forEach((sd,i)=>{ const a=(i/seeds.length)*Math.PI*2; const wl=buildWilderness(THREE, mats, nodeRng('aldermere',sd), ()=>0, true); wl.position.set(Math.cos(a)*R, 0, Math.sin(a)*R); scene.add(wl); });
}
(async()=>{
  await Promise.all([ensureFoliageGLBs(), ensureCreatureKit()]).catch(()=>{});
  await new Promise(r=>setTimeout(r,500));
  place();
  document.getElementById('hud').textContent='REAL buildSettlement (livestock) + buildWilderness ×6 (some = bandit camps)';
  window.__ready=true; view(0,60,70);
})();
function view(az,el,r){ const ph=el*Math.PI/180,a=az*Math.PI/180; camera.position.set(Math.sin(a)*Math.cos(ph)*r, Math.sin(ph)*r, Math.cos(a)*Math.cos(ph)*r); controls.target.set(0,0,0); controls.update(); renderNow(); }
window.__view=view;
window.renderNow=()=>renderer.render(scene,camera);
window.__resize=(w,h)=>{W=w||1280;H=h||800;renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();renderNow();return W+'x'+H;};
addEventListener('resize',()=>window.__resize(innerWidth,innerHeight));
function loop(){ controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);} loop();
</script>
</body>
</html>
