<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Structure catalog — one per style</title>
<style>
  html,body{margin:0;background:#3a3f37;font-family:ui-sans-serif,system-ui,sans-serif;color:#cdd2c4;padding:14px;}
  h1{font-size:15px;font-weight:600;opacity:.8;margin:0 0 12px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .cell{background:#2a2e27;border-radius:8px;padding:8px;}
  .cell h2{font-size:13px;margin:0 0 6px;font-weight:600;}
  .cell .meta{font-size:11px;opacity:.6;float:right;font-weight:400;}
  canvas{width:100%;height:auto;display:block;box-shadow:0 8px 24px rgba(0,0,0,.45);border-radius:4px;}
</style></head>
<body>
<h1>Structure catalog — one authored plan per style (rooms butt, doors on shared walls)</h1>
<div class="grid" id="grid"></div>
<script type="module">
import { createInteriorMap, planToSceneModel } from '/map/handDrawnInterior.js';
import { PLANS } from '/map/plans/index.js';

const grid = document.getElementById('grid');
for (const plan of PLANS) {
  const cell = document.createElement('div'); cell.className = 'cell';
  const h2 = document.createElement('h2'); h2.innerHTML = `${plan.name} <span class="meta">${plan.type} · ${plan.material} · T${plan.tier}</span>`;
  const cv = document.createElement('canvas'); cv.width = 420; cv.height = 360;
  cell.appendChild(h2); cell.appendChild(cv); grid.appendChild(cell);
  const entry = plan.rooms.find(r => r.id === plan.entry) || plan.rooms[0];
  const tokens = entry ? [{ type: 'player', ux: entry.cx, uy: entry.cy }] : [];
  const map = createInteriorMap(cv, { seed: plan.id });
  map.draw(planToSceneModel(plan, { currentRoomId: plan.entry, tokens }));
}
window.__rendered = PLANS.length;
</script>
</body></html>
